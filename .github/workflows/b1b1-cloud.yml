name: b1b1 cloud check

on:
  push:
    branches:
      - test/b1b1-cloud
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Mathlib and cache
        working-directory: lean
        run: |
          lean --version
          lake exe cache get

      - name: Compile b1-b1 module
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean PEqualNP/Outside/L_goldbach_frontier_type2_b1_b1.lean 2>&1 | tee /tmp/b1b1.log
          echo "---- line count of log: $(wc -l < /tmp/b1b1.log) ----"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1b1-compile-log
          path: /tmp/b1b1.log
          if-no-files-found: warn
