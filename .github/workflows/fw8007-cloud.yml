name: Read live Goldbach open lemmas
on:
  pull_request:
    branches: [main]
  push:
    branches: [test/lean-fw8007-cloud]
permissions:
  contents: read
jobs:
  live-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public status (no claims)
        run: |
          curl --fail --silent --show-error --compressed --retry 2 --max-time 45 'https://www.movan.tech/goldbach/api/status' -o /tmp/goldbach-status.json
          python3 - <<'PY'
          import json, datetime
          s=json.load(open('/tmp/goldbach-status.json'))
          print('STATUS UTC:', datetime.datetime.now(datetime.timezone.utc).isoformat())
          print('COUNTS:', s.get('counts'))
          for g in s['gaps']:
              if g.get('proved') is False:
                  print(json.dumps({'id':g['id'],'proved':g['proved'],'latest':(g.get('latest') or {}).get('verdict'),'statement':g.get('statement','')[:300]},ensure_ascii=False))
          PY
